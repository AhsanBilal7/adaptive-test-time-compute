# ===================================================
# Custom Experiment
# ===================================================
# ============================================================================
# MODE 2: FIXED TOOL (Use specific tool without dynamic selection)
# ============================================================================
agent:
  mode: fixed_tool_compute
  use_planner: false
  use_tool_selector: false
  use_compute_selector: false
  remember_cot: true
  max_text_history: 16
  max_image_history: 0
  fixed_tool: cot  # Options: cot, self_reflection
  fixed_compute:
    strategy: lookahead  # Options: best_of_n, beam_search, lookahead
    param: 1  # Number of samples/beams
  planning_frequency: null
  domain: math

eval:
  num_workers: 16
  output_dir: fixed_tool_compute_llama_cot_bestof_1_iteration_1
  max_problems: null
  num_iterations: 1
  split: test
  problem_types: null
  difficulty_levels: null

client:
  client_name: ollama
  base_url: http://localhost:11434/v1
  model_id: llama3.1:8b-instruct
  generate_kwargs:
    temperature: 0.95
    top_k: 0.95
    max_tokens: 1024
  timeout: 60
  max_retries: 5
  delay: 2
  alternate_roles: false


