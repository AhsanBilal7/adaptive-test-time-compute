seed: 42

model:
  name: ${OLLAMA_MODEL}
  temperature: 0.8
  top_p: 0.95
  max_tokens: 512
  stop: ["\n\n"]

reasoning:
  K: 8
  sweet_spot:
    low: 0.30
    high: 0.60
    prefer_center: true

dataset:
  name: gsm8k
  split: test
  limit: 200

baselines:
  greedy: true
  self_consistency: true

io:
  out_dir: outputs/gsm8k
  save_jsonl: true
  save_traces: true
  verbose_samples: 3