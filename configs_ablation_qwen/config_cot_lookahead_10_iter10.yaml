agent:
  mode: fixed_tool_compute
  use_planner: false
  use_tool_selector: false
  use_compute_selector: false
  remember_cot: true
  max_text_history: 16
  max_image_history: 0
  fixed_tool: cot
  fixed_compute:
    strategy: lookahead
    param: 10
  planning_frequency: null
  domain: math

eval:
  num_workers: 16
  output_dir: fixed_tool_compute_qwen_cot_lookahead_10_iteration_10
  max_problems: null
  num_iterations: 10
  use_prm_selection: true
  prm_selection_metric: "mean_reward"
  split: test
  problem_types: null
  difficulty_levels: null

client:
  client_name: ollama
  base_url: http://localhost:11434/v1
  model_id: qwen2.5:7b-instruct
  generate_kwargs:
    temperature: 0.95
    top_k: 0.95
    max_tokens: 1024
  timeout: 60
  max_retries: 5
  delay: 2
  alternate_roles: false
